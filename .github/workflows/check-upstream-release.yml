name: Check upstream sharp release

'on':
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for new sharp release and dispatch build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          LATEST_SHARP_VERSION="$(npm view sharp version)"
          TAG="v${LATEST_SHARP_VERSION}"
          echo "Latest upstream sharp version: $LATEST_SHARP_VERSION"

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists, nothing to do."
            exit 0
          fi

          echo "No release $TAG found, dispatching build-and-publish workflow..."
          gh workflow run build-and-publish.yml \
            --repo "${{ github.repository }}" \
            -f sharp_version="$LATEST_SHARP_VERSION"
