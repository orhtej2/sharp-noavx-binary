name: Build and Publish sharp-libvips (noavx) package

'on':
  workflow_dispatch:
    inputs:
      sharp_libvips_version:
        description: '@img/sharp-libvips-linux-x64 npm version to base the package on (leave empty for latest)'
        required: false
        type: string
      libvips_noavx_tag:
        description: 'libvips-noavx-binary release tag to source binaries from (leave empty to auto-match)'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Build package
        run: |
          set -euxo pipefail
          chmod +x ./build.sh
          ./build.sh "${{ inputs.sharp_libvips_version }}" "${{ inputs.libvips_noavx_tag }}"

      - name: Determine release tag
        id: meta
        run: |
          set -euxo pipefail
          ASSET="$(ls build/*.tar.gz | head -n1)"
          VERSION="$(basename "$ASSET" .tar.gz | sed -E 's/^sharp-libvips-linux-x64-noavx-//')"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release and upload asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          ASSET="${{ steps.meta.outputs.asset }}"
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --title "sharp-libvips-linux-x64 $TAG (x86_64-v1, no AVX/AVX2)" \
              --notes "Drop-in replacement for node_modules/@img/sharp-libvips-linux-x64, rebuilt for the x86-64-v1 CPU baseline (no AVX/AVX2)."
          fi
